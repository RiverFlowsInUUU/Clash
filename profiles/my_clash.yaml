# ============================================================================
#  my_clash.yaml — mihomo 个人配置模板
# ============================================================================
#  来源：自用路由器的实测配置，剥离私有节点后整理为可复用模板。
#
#  特点
#    · DNS 双层广告拦截
#        fake-ip-filter: rule-set:xxx   → 广告域名跳过 fake-ip
#        nameserver-policy: rcode://success → DNS 直接返回空回答（更早、更省）
#        规则层 RULE-SET,xxx,AD 保留为兜底（IP 直连 / DoH / 缓存解析）
#    · 全 MRS 规则集（不依赖 geosite.dat / geoip.dat）
#    · 单一订阅槽位 Airport；无内联节点
#
#  使用
#    1) 修改下方 proxy-providers.Airport.url 为你的订阅链接；
#    2) 本地校验： mihomo -t -d . -f my_clash.yaml
# ============================================================================

# ── 基础运行参数 ────────────────────────────────────────────────────────────
mixed-port: 7890                  # HTTP/SOCKS 混合代理端口
allow-lan: false                  # 旁路由/共享场景可改 true
bind-address: '*'
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
external-controller: 127.0.0.1:9090

# ── GEO 数据库 ──────────────────────────────────────────────────────────────
# 说明：rules 已全部改用 MRS，不再引用 GEOSITE/GEOIP。
#       此处保留仅为兼容与兜底，可整段删除。
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"
geo-auto-update: true
geo-update-interval: 48

# ── 订阅 ────────────────────────────────────────────────────────────────────
# ★ 唯一必改项：把 url 换成你的机场订阅。
#   节点全部由订阅拉取，模板不内联任何单个节点。
proxy-providers:
  Airport:
    type: http
    url: "https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN"
    path: ./proxy_provider/Airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# ── 策略组 ──────────────────────────────────────────────────────────────────
# 节点来源统一为 use: [Airport]；Smart = 全池自动择优，Select = 手动挑。
proxy-groups:
  # 总入口：默认走 Fallback（自动故障转移）
  - name: Proxy
    type: select
    proxies:
      - Fallback
      - MAX
      - Smart
      - Select
      - HongKong
      - Taiwan
      - Japan
      - Singapore
      - United States
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png

  # 故障转移：MAX → Smart → Select 依次回退
  - name: Fallback
    type: fallback
    proxies:
      - MAX
      - Smart
      - Select
    url: https://www.gstatic.com/generate_204
    interval: 300
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bypass.png

  # 全池自动择优（url-test，面板隐藏）
  # filter 排除订阅里可能附带的「直连」类节点
  - name: Smart
    type: url-test
    use:
      - Airport
    filter: ^((?!(直连)).)*$
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png

  # 全池手动选择
  - name: Select
    type: select
    use:
      - Airport
    filter: ^((?!(直连)).)*$
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png

  # Claude / Anthropic 专用
  - name: Anthropic
    type: select
    proxies:
      - Taiwan
      - Select
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Rule/refs/heads/main/claude-color.png

  # AI 全家桶兜底
  - name: AI
    type: select
    proxies:
      - Taiwan
      - Select
      - Japan
      - Singapore
      - United States
      - Proxy
      - Smart
    icon: https://www.edigitalagency.com.au/wp-content/uploads/new-ChatGPT-icon-white-png-medium-size.png

  # 自建 Emby 媒体服务器
  - name: Emby
    type: select
    proxies:
      - Select
      - Smart
      - United States
      - Taiwan
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Emby.png

  # Google 全家桶
  - name: Google
    type: select
    proxies:
      - AI
      - Proxy
      - HongKong
      - Taiwan
      - Japan
      - Singapore
      - United States
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png

  # YouTube
  - name: YouTube
    type: select
    proxies:
      - Proxy
      - HongKong
      - Taiwan
      - Japan
      - Singapore
      - United States
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png

  # YouTube Music
  - name: YouTube Music
    type: select
    proxies:
      - Proxy
      - HongKong
      - Taiwan
      - Japan
      - Singapore
      - United States
      - Select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube_Music.png

  # Spotify
  - name: Spotify
    type: select
    proxies:
      - United States
      - HongKong
      - Taiwan
      - Japan
      - Singapore
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png

  # 微软服务（默认 DIRECT）
  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - Proxy
      - Taiwan
      - Japan
      - Singapore
      - United States
