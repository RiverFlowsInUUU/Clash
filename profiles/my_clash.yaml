    icon: https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/RoundRobin.svg


# ── DNS ─────────────────────────────────────────────────────────────────────
# 双层广告拦截的核心：
#   ① fake-ip-filter 里的 rule-set 让广告域名「不下发 fake-ip」，
#      否则 withFakeIP 中间件会直接返回假 IP，nameserver-policy 永远看不到请求；
#   ② nameserver-policy 把同一批域名指向 rcode://success，返回空回答。
#   ③ 顺序要求：广告 policy 必须写在 rule-set:private,cn 之前。
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  prefer-h3: false

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 国内 DoH（代理 / 直连 / CN 策略共用）
  direct-nameserver:
    - https://doh.18bit.cn/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - https://doh.18bit.cn/dns-query
    - https://dns.alidns.com/dns-query

  # 境外 DoH（默认兜底）
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true

  nameserver-policy:
    # ① 广告域名 → DNS 层空回答（必须在 cn 之前）
    "rule-set:AWAvenue-Ads": rcode://success
    "rule-set:jinx-ads-delta": rcode://success
    # ② 国内域名 → 国内 DoH（兜底）
    "rule-set:private,cn":
      - https://doh.18bit.cn/dns-query
      - https://dns.alidns.com/dns-query

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - "stun.*"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.market.xiaomi.com"
    # 广告域名跳过 fake-ip（配合上面的 nameserver-policy 生效）
    - "rule-set:AWAvenue-Ads"
    - "rule-set:jinx-ads-delta"

# ── 规则集（全部 MRS / 远程）────────────────────────────────────────────────
