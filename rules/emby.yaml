#    不随任何第三方清单漂移 ⇒ 放本仓维护最直接，也避免跨项目引用。
#
# 条数：4（**本行为唯一真源**，改内容时同步改这里）
# 格式：mihomo rule-provider（format: yaml / behavior: classical）
# 落点：RULE-SET,emby,Emby

payload:
