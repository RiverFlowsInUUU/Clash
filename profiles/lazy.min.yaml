proxies:
  - name: Node-A
    type: hysteria2
    server: 203.0.113.10
    port: 52341
    password: REPLACE_WITH_YOUR_PASSWORD
    sni: REPLACE_WITH_YOUR_SNI
  - name: Node-B
    type: hysteria2
    server: 203.0.113.11
    port: 52341
    password: REPLACE_WITH_YOUR_PASSWORD
    sni: REPLACE_WITH_YOUR_SNI
proxy-providers:
  Airport:
    type: http
    url: https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    path: ./proxy_provider/Airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: Proxy
    type: url-test
    proxies:
      - Node-A
    use:
      - Airport
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/Proxy.png
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: AI
    type: select
    proxies:
      - Node-B
    use:
      - Airport
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/grok.png
  - name: AD
    type: select
    proxies:
      - REJECT
    icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/icons/AdBlock.png
rule-providers:
  AWAvenue-Ads:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.mrs
    path: ./rule_provider/AWAvenue-Ads-Rule-Clash.mrs
    interval: 86400
  jinx-ads:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/mihomo-ads.yaml
    path: ./rule_provider/jinx-ads-delta.yaml
    interval: 86400
  jinx-white-guard:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/RiverFlowsInUUU/Jinx/main/mihomo-white-guard.yaml
    path: ./rule_provider/jinx-white-guard.yaml
    interval: 86400
  AI-Domains:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/rules/AI.list
    path: ./rule_provider/AI-Domains.list
    interval: 86400
  apple-system:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/RiverFlowsInUUU/Self-Configuration/main/rules/apple_system.list
    path: ./rule_provider/apple-system.list
    interval: 86400
rules:
  - RULE-SET,jinx-white-guard,DIRECT
  - RULE-SET,jinx-ads,AD
  - RULE-SET,AWAvenue-Ads,AD
  - GEOIP,private,DIRECT
  - GEOSITE,private,DIRECT
  - RULE-SET,apple-system,DIRECT
  - GEOSITE,category-ai-chat-!cn,AI
  - RULE-SET,AI-Domains,AI
  - GEOSITE,cn,DIRECT
  - GEOIP,cn,DIRECT
  - MATCH,Proxy
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "+.xboxlive.com"
    - "stun.*"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.market.xiaomi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    "geosite:private,cn":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
tun:
  enable: true
  stack: mips
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
