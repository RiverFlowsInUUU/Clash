name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:17 UTC 跑一次 —— 远程规则集是别人的仓库，随时可能改名/删档，
    # 只在 push 时检查抓不到"上游悄悄变了"这种情况（本仓踩过 Jinx 改名）。
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          node --version

      - name: Encoding gate (cp936)
        # Windows 中文环境（ACP=936）下子进程 stdout 走管道时 Python 用 cp936 编码 ——
        # 脚本 print 一个非 GBK 字符（✅/❌/⚠️）就 UnicodeEncodeError 并以**退出码 1** 结束，
        # 而 1 恰是本仓「判负」的码 ⇒ 崩溃会被读成「判负」，整轮看着对、其实判据没跑。
        # 这里在 Linux 上等价复现该路径，缺保护的闸门脚本当场红。
        run: python skill/tests/check_structure.py
        env:
          PYTHONIOENCODING: cp936

      - name: Structure gate (profiles)
        # 悬空引用 / 规则指向 / DNS 广告拦截双条件 / IPv6 显式关闭
        run: python skill/tests/check_structure.py

      - name: min-pair consistency
        # .min 必须与完整版的配置本体逐字相同（去注释后）。
        # 本仓 profile 由脚本生成，改了脚本忘了重生成 .min 就会漂移。
        run: python skill/tests/check_min_pair.py

      - name: Script output vs static profile
        # override/*.js 的输出必须与 profiles/*.yaml 逐位一致 ——
        # 两边是同一套配置的两种交付形态，漂移即事故。
        run: python skill/tests/check_script_sync.py

      - name: Remote ruleset reachability
        # 死链不报错，只会让规则集静默变空、拦截悄悄失效。
        # 定时跑是为了抓"上游改名/删档"这类本仓无从感知的变化。
        run: python skill/tests/check_remote_urls.py --timeout 20
        continue-on-error: ${{ github.event_name == 'pull_request' }}
