mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
external-controller: 127.0.0.1:9090
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
geo-auto-update: true
geo-update-interval: 48
proxy-providers:
  Airport:
    type: http
    url: https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN
    path: ./proxy_provider/Airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
- name: Proxy
  type: select
  proxies:
  - Fallback
  - MAX
  - Smart
  - Select
  - HongKong
  - Taiwan
  - Japan
  - Singapore
  - United States
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
- name: Fallback
  type: fallback
  proxies:
  - Nodes
  - MAX
  - Smart
  url: https://www.gstatic.com/generate_204
  interval: 300
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Bypass.png
- name: Smart
  type: url-test
  use:
  - Airport
  filter: ^((?!(直连)).)*$
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  hidden: true
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
- name: Select
  type: select
  use:
  - Airport
  filter: ^((?!(直连)).)*$
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Static.png
- name: Anthropic
  type: select
  proxies:
  - Taiwan
  - Select
  icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Rule/refs/heads/main/claude-color.png
- name: AI
  type: select
  proxies:
  - Taiwan
  - Select
  - Japan
  - Singapore
  - United States
  - Proxy
  - Smart
  icon: https://www.edigitalagency.com.au/wp-content/uploads/new-ChatGPT-icon-white-png-medium-size.png
- name: Emby
  type: select
  proxies:
  - Select
  - Smart
  - United States
  - Taiwan
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Emby.png
- name: Google
  type: select
  proxies:
  - AI
  - Proxy
  - HongKong
  - Taiwan
  - Japan
  - Singapore
  - United States
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
- name: YouTube
  type: select
  proxies:
  - Proxy
  - HongKong
  - Taiwan
  - Japan
  - Singapore
  - United States
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png
- name: YouTube Music
  type: select
  proxies:
  - Proxy
  - HongKong
  - Taiwan
  - Japan
  - Singapore
  - United States
  - Select
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube_Music.png
- name: Spotify
  type: select
  proxies:
  - United States
  - HongKong
  - Taiwan
  - Japan
  - Singapore
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png
- name: Microsoft
  type: select
  proxies:
  - DIRECT
  - Proxy
  - Taiwan
  - Japan
  - Singapore
  - United States
  - Select
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png
- name: Telegram
  type: select
  proxies:
  - Proxy
  - HongKong
  - Taiwan
  - Japan
  - Singapore
  - United States
  - Select
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png
- name: Apple
  type: select
  proxies:
  - DIRECT
  - Proxy
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png
- name: Final
  type: select
  proxies:
  - Proxy
  - HongKong
  - Taiwan
  - Japan
  - Singapore
  - United States
  - Select
  - DIRECT
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png
- name: HongKong
  type: url-test
  use:
  - Airport
  filter: (?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png
- name: Japan
  type: url-test
  use:
  - Airport
  filter: (?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png
- name: Singapore
  type: url-test
  use:
  - Airport
  filter: (?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|深|美)).)*$
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png
- name: Taiwan
  type: url-test
  use:
  - Airport
  filter: (?=.*(台|TW|(?i)Taiwan|Tai))^((?!(港|韩|新|美|日)).)*$
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png
- name: United States
  type: url-test
  use:
  - Airport
  filter: (?=.*(美|US|(?i)States|America))^((?!(港|台|韩|新|日)).)*$
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png
- name: Nodes
  type: url-test
  proxies:
  - Smart
  - Select
  - MAX
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Airport.png
- name: Apple Update
  type: select
  proxies:
  - REJECT
  - PASS
  - DIRECT
  icon: https://raw.githubusercontent.com/RiverFlowsInUUU/Rule/main/appleupdateicon.png
- name: AD
  type: select
  proxies:
  - REJECT
  - PASS
  - DIRECT
  icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Advertising.png
- name: MAX
  type: url-test
  use:
  - Airport
  filter: ^(?=.*(0\.1|0\.01))((?!剩余|流量|到期|有效).)*$
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  hidden: true
  icon: https://fastly.jsdelivr.net/gh/AIsouler/MyClash@main/Icons/svg/RoundRobin.svg
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  prefer-h3: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  direct-nameserver:
  - https://doh.18bit.cn/dns-query
  - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
  - https://doh.18bit.cn/dns-query
  - https://dns.alidns.com/dns-query
  nameserver:
  - https://dns.cloudflare.com/dns-query
  - https://dns.google/dns-query
  fallback:
  - https://dns.cloudflare.com/dns-query
  - https://dns.google/dns-query
  fallback-filter:
    geoip: true
  nameserver-policy:
    rule-set:AWAvenue-Ads: rcode://success
    rule-set:jinx-ads-delta: rcode://success
    rule-set:private,cn:
    - https://doh.18bit.cn/dns-query
    - https://dns.alidns.com/dns-query
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.localdomain'
  - '*.home.arpa'
  - +.msftconnecttest.com
  - +.msftncsi.com
  - localhost.ptlogin2.qq.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - +.xboxlive.com
  - stun.*
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - +.market.xiaomi.com
  - rule-set:AWAvenue-Ads
  - rule-set:jinx-ads-delta
rule-providers:
  apple-update:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple-update.mrs
