# AI_Domains.yaml
# 本仓自托管的规则集：AI 伴生域 / 宽后缀整合集 → AI 分流组。
#
# 内容来源 = 姊妹仓 Self-Configuration 的 rules/AI.list（272 条静态快照，
#   该集由 5 个上游归并：Repcz / 墨鱼 / ACL4SSR / blackmatrix7 / MetaCubeX）
#
# 为什么需要它：本仓 AI 组当前引用 MetaCubeX 的 category-ai-chat-!cn
#   （188 条），实测漏掉本集 93 条 —— 主要是各家 AI 清单都不收的
#   **伴生域**：认证 / 遥测 / 风控基础设施
#   （auth0、statsig、arkoselabs、apis.google.com、apple-relay 等）。
#   这些域单独看不像 AI 域，漏出 AI 组会导致伴生请求走不同出口、
#   触发风控。本集即补这个洞。
#
# 条数：272（**本行为唯一真源**，改内容时同步改这里）
# 格式：mihomo rule-provider（format: yaml / behavior: classical）
#
# ⚠️ 纯域名集、零 IP 条目 ⇒ 引用方**不写**规则级 no-resolve。
# ⚠️ 含 1 条 URL-REGEX（Google 跳 Gemini 的 URL 匹配）；若内核不支持
#     该项，会忽略单条而不会使整个文件加载失败。
#
# 落点：RULE-SET,AI_Domains,AI（排在 AI 之后、YouTube Music 之前，
#   与姊妹仓同序；Google 相关宽域由本集先行接管，是该仓有意设计）
# 同步：姊妹仓更新 AI.list 后，需人工重新生成本文件。
#
# 原始头部（来源说明）见姊妹仓 rules/AI.list
